# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      # Avoid workspace hoisting: install in frontend only so Rollup's
      # platform optional deps (e.g. @rollup/rollup-linux-x64-gnu) are installed correctly.
      - name: Isolate frontend for install
        run: |
          mv package.json package.json.bak
          mv package-lock.json package-lock.json.bak 2>/dev/null || true
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          # Set in repo Secrets so production build calls your Worker (e.g. https://set-check-api.xxx.workers.dev)
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
      - name: Restore root package files
        run: |
          mv package.json.bak package.json
          mv package-lock.json.bak package-lock.json 2>/dev/null || true
        if: always()
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./frontend/dist"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
