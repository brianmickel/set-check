# Deploy Cloudflare Worker (API). Requires GitHub secrets: CF_API_TOKEN, CF_ACCOUNT_ID, ALLOWED_ORIGINS.
# The RATE_LIMIT KV namespace id is committed in worker/wrangler.toml (not a credential).
# Worker runtime secrets (OPENAI_API_KEY, JWT_SECRET) must be set in Cloudflare, not here.
name: Deploy Worker

on:
  push:
    branches: ["main"]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Inject ALLOWED_ORIGINS (CORS)
        env:
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
        run: |
          if [ -z "$ALLOWED_ORIGINS" ]; then
            echo "::error::ALLOWED_ORIGINS secret is not set. Add it in repo Settings → Secrets. See docs/DEPLOY.md"
            exit 1
          fi
          sed -i.bak "s|<SET_CHECK_ALLOWED_ORIGINS>|$ALLOWED_ORIGINS|g" worker/wrangler.toml

      - name: Deploy to Cloudflare Workers
        run: npm run deploy:worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
