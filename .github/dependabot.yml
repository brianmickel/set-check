version: 2
updates:
  # Root workspace (backend/ and worker/ resolve through the root package-lock.json)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      root-deps:
        patterns: ["*"]

  # frontend/ has its own package-lock.json (CI installs it in isolation)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    groups:
      frontend-deps:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "monthly"
    groups:
      backend-deps:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/worker"
    schedule:
      interval: "monthly"
    groups:
      worker-deps:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns: ["*"]
