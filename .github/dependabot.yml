version: 2
updates:
  # Root workspaces: backend/ and worker/ share the root package-lock.json
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      root-deps:
        patterns: ["*"]
    ignore:
      # typescript-eslint does not support TypeScript 7 yet
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # tracks the Node major in .nvmrc; bump together with Node
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # frontend/ is a standalone package with its own package-lock.json
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      frontend-deps:
        patterns: ["*"]
    ignore:
      # typescript-eslint does not support TypeScript 7 yet
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # tracks the Node major in .nvmrc; bump together with Node
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
