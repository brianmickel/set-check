name = "set-check-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Analyze path does base64 + OpenAI vision; allow enough CPU time (default can be 10–30ms)
[limits]
cpu_ms = 60000

# KV for rate limits and issued upload keys
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "<SET_CHECK_RATE_LIMIT_KV_ID>"

# R2 bucket for temporary uploads
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "set-check-uploads"

# Secrets (set via wrangler secret put):
# OPENAI_API_KEY, JWT_SECRET
# Optional: TURNSTILE_SECRET_KEY
# For R2 presigned URLs (S3 API): R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY
# Optional: INCLUDE_BOUNDING_BOXES=false to skip bbox in analyze (cards only)

[vars]
R2_BUCKET_NAME = "set-check-uploads"
# Empty = only localhost allowed (dev default). In production this is injected by
# the deploy workflow from the ALLOWED_ORIGINS GitHub secret (see docs/DEPLOY.md).
ALLOWED_ORIGINS = ""