name = "set-check-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"


# KV for rate limits and issued upload keys
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "<SET_CHECK_RATE_LIMIT_KV_ID>"

# R2 bucket for temporary uploads
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "set-check-uploads"

# Secrets (set via `npx wrangler secret put <NAME> --name set-check-api`):
# Required: JWT_SECRET
# Vision providers — set at least one (auto-priority: Gemini → Claude → OpenAI):
#   OPENAI_API_KEY, GEMINI_API_KEY, ANTHROPIC_API_KEY
# Optional: INCLUDE_BOUNDING_BOXES=false to skip bbox in analyze (cards only)
# For R2 presigned URLs: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY

[vars]
R2_BUCKET_NAME = "set-check-uploads"
ALLOWED_ORIGINS = "<SET_CHECK_ALLOWED_ORIGINS>"